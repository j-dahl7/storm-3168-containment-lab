<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="828" viewBox="0 0 1280 828" role="img" aria-labelledby="title desc">
<title id="title">A guarded Sentinel response, followed by independent verification</title><desc id="desc">Conceptual six-step flow: collect administrative evidence, create a lab incident, refetch and validate evidence, check the fixed response target, remove one approved assignment under a role condition, and independently probe the same token. The final probe is outside the Logic App.</desc>
