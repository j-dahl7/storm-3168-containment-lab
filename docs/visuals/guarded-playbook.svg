<text x="128" y="47" fill="#ffbc4b" font-family="Consolas, 'Cascadia Mono', SFMono-Regular, Menlo, 'Liberation Mono', monospace" font-size="15" font-weight="600" text-anchor="start"><tspan x="128" dy="0">FIELD NOTES  /  02</tspan></text>
<rect x="980" y="28" width="244" height="32" rx="16" fill="#0d1624" stroke="#aab8cc" />
<text x="1102.0" y="50" fill="#aab8cc" font-family="Consolas, 'Cascadia Mono', SFMono-Regular, Menlo, 'Liberation Mono', monospace" font-size="14" font-weight="650" text-anchor="middle"><tspan x="1102.0" dy="0">EXPLANATORY DIAGRAM</tspan></text>
<path d="M56,770 L1224,770" fill="none" stroke="#2c3a50" stroke-width="2"/>
<image href="data:image/png;base64," x="55" y="785" width="30" height="30"/>
<text x="98" y="806" fill="#ffbc4b" font-family="Consolas, 'Cascadia Mono', SFMono-Regular, Menlo, 'Liberation Mono', monospace" font-size="14" font-weight="700" text-anchor="start"><tspan x="98" dy="0">NINE LIVES, ZERO TRUST</tspan></text>
<text x="1224" y="806" fill="#aab8cc" font-family="Consolas, 'Cascadia Mono', SFMono-Regular, Menlo, 'Liberation Mono', monospace" font-size="14" font-weight="400" text-anchor="end"><tspan x="1224" dy="0">nineliveszerotrust.com  /  Storm-3168 lab</tspan></text>
<text x="56" y="100" fill="#f3f6fc" font-family="'Segoe UI', -apple-system, BlinkMacSystemFont, 'Helvetica Neue', Roboto, 'Liberation Sans', Arial, sans-serif" font-size="34" font-weight="750" text-anchor="start"><tspan x="56" dy="0">An incident starts the check. It does not prove containment.</tspan></text>
<text x="56" y="138" fill="#aab8cc" font-family="'Segoe UI', -apple-system, BlinkMacSystemFont, 'Helvetica Neue', Roboto, 'Liberation Sans', Arial, sans-serif" font-size="22" font-weight="400" text-anchor="start"><tspan x="56" dy="0">The playbook changes configuration. The separate harness measures access.</tspan></text>
<rect x="56" y="195" width="362" height="148" rx="16" fill="#111a28" stroke="#2c3a50" />
<circle cx="88" cy="226" r="16" fill="#17283b" stroke="#75dbff" stroke-width="1"/>
<text x="88" y="232" fill="#75dbff" font-family="Consolas, 'Cascadia Mono', SFMono-Regular, Menlo, 'Liberation Mono', monospace" font-size="17" font-weight="700" text-anchor="middle"><tspan x="88" dy="0">1</tspan></text>
<text x="116" y="233" fill="#f3f6fc" font-family="'Segoe UI', -apple-system, BlinkMacSystemFont, 'Helvetica Neue', Roboto, 'Liberation Sans', Arial, sans-serif" font-size="21" font-weight="700" text-anchor="start"><tspan x="116" dy="0">Collect the right logs</tspan></text>
<text x="81" y="276" fill="#aab8cc" font-family="'Segoe UI', -apple-system, BlinkMacSystemFont, 'Helvetica Neue', Roboto, 'Liberation Sans', Arial, sans-serif" font-size="20" font-weight="400" text-anchor="start"><tspan x="81" dy="0">Export AzureActivity to</tspan><tspan x="81" dy="27.0">the selected lab workspace.</tspan></text>
<rect x="460" y="195" width="362" height="148" rx="16" fill="#111a28" stroke="#2c3a50" />
<circle cx="492" cy="226" r="16" fill="#17283b" stroke="#75dbff" stroke-width="1"/>
<text x="492" y="232" fill="#75dbff" font-family="Consolas, 'Cascadia Mono', SFMono-Regular, Menlo, 'Liberation Mono', monospace" font-size="17" font-weight="700" text-anchor="middle"><tspan x="492" dy="0">2</tspan></text>
<text x="520" y="233" fill="#f3f6fc" font-family="'Segoe UI', -apple-system, BlinkMacSystemFont, 'Helvetica Neue', Roboto, 'Liberation Sans', Arial, sans-serif" font-size="21" font-weight="700" text-anchor="start"><tspan x="520" dy="0">Create a lab incident</tspan></text>
<text x="485" y="276" fill="#aab8cc" font-family="'Segoe UI', -apple-system, BlinkMacSystemFont, 'Helvetica Neue', Roboto, 'Liberation Sans', Arial, sans-serif" font-size="20" font-weight="400" text-anchor="start"><tspan x="485" dy="0">Scope the analytic to the</tspan><tspan x="485" dy="27.0">recorded actor and resources.</tspan></text>
<rect x="864" y="195" width="362" height="148" rx="16" fill="#111a28" stroke="#2c3a50" />
<circle cx="896" cy="226" r="16" fill="#17283b" stroke="#75dbff" stroke-width="1"/>
<text x="896" y="232" fill="#75dbff" font-family="Consolas, 'Cascadia Mono', SFMono-Regular, Menlo, 'Liberation Mono', monospace" font-size="17" font-weight="700" text-anchor="middle"><tspan x="896" dy="0">3</tspan></text>
<text x="924" y="233" fill="#f3f6fc" font-family="'Segoe UI', -apple-system, BlinkMacSystemFont, 'Helvetica Neue', Roboto, 'Liberation Sans', Arial, sans-serif" font-size="21" font-weight="700" text-anchor="start"><tspan x="924" dy="0">Check fresh evidence</tspan></text>
<text x="889" y="276" fill="#aab8cc" font-family="'Segoe UI', -apple-system, BlinkMacSystemFont, 'Helvetica Neue', Roboto, 'Liberation Sans', Arial, sans-serif" font-size="20" font-weight="400" text-anchor="start"><tspan x="889" dy="0">Refetch the incident and alert.</tspan><tspan x="889" dy="27.0">Match rule, actor and scope.</tspan></text>
<path d="M423,269 L454,269" fill="none" stroke="#75dbff" stroke-width="2" marker-end="url(#c)"/>
<path d="M827,269 L858,269" fill="none" stroke="#75dbff" stroke-width="2" marker-end="url(#c)"/>
<path d="M1045 346V400" fill="none" stroke="#75dbff" stroke-width="2" marker-end="url(#c)"/>
<rect x="864" y="420" width="362" height="148" rx="16" fill="#111a28" stroke="#2c3a50" />
<circle cx="896" cy="451" r="16" fill="#17283b" stroke="#75dbff" stroke-width="1"/>
<text x="896" y="457" fill="#75dbff" font-family="Consolas, 'Cascadia Mono', SFMono-Regular, Menlo, 'Liberation Mono', monospace" font-size="17" font-weight="700" text-anchor="middle"><tspan x="896" dy="0">4</tspan></text>
<text x="924" y="458" fill="#f3f6fc" font-family="'Segoe UI', -apple-system, BlinkMacSystemFont, 'Helvetica Neue', Roboto, 'Liberation Sans', Arial, sans-serif" font-size="21" font-weight="700" text-anchor="start"><tspan x="924" dy="0">Recheck the target</tspan></text>
<text x="889" y="501" fill="#aab8cc" font-family="'Segoe UI', -apple-system, BlinkMacSystemFont, 'Helvetica Neue', Roboto, 'Liberation Sans', Arial, sans-serif" font-size="20" font-weight="400" text-anchor="start"><tspan x="889" dy="0">Confirm the lab tag and exact</tspan><tspan x="889" dy="27.0">principal, role and assignment.</tspan></text>
<rect x="460" y="420" width="362" height="148" rx="16" fill="#111a28" stroke="#2c3a50" />
<circle cx="492" cy="451" r="16" fill="#17283b" stroke="#ffbc4b" stroke-width="1"/>
<text x="492" y="457" fill="#ffbc4b" font-family="Consolas, 'Cascadia Mono', SFMono-Regular, Menlo, 'Liberation Mono', monospace" font-size="17" font-weight="700" text-anchor="middle"><tspan x="492" dy="0">5</tspan></text>
<text x="520" y="458" fill="#f3f6fc" font-family="'Segoe UI', -apple-system, BlinkMacSystemFont, 'Helvetica Neue', Roboto, 'Liberation Sans', Arial, sans-serif" font-size="21" font-weight="700" text-anchor="start"><tspan x="520" dy="0">Remove one assignment</tspan></text>
<text x="485" y="501" fill="#aab8cc" font-family="'Segoe UI', -apple-system, BlinkMacSystemFont, 'Helvetica Neue', Roboto, 'Liberation Sans', Arial, sans-serif" font-size="20" font-weight="400" text-anchor="start"><tspan x="485" dy="0">A role condition allows</tspan><tspan x="485" dy="27.0">one principal and role.</tspan></text>
<rect x="56" y="420" width="362" height="148" rx="16" fill="#111a28" stroke="#2c3a50" />
<circle cx="88" cy="451" r="16" fill="#17283b" stroke="#69dec0" stroke-width="1"/>
<text x="88" y="457" fill="#69dec0" font-family="Consolas, 'Cascadia Mono', SFMono-Regular, Menlo, 'Liberation Mono', monospace" font-size="17" font-weight="700" text-anchor="middle"><tspan x="88" dy="0">6</tspan></text>
<text x="116" y="458" fill="#f3f6fc" font-family="'Segoe UI', -apple-system, BlinkMacSystemFont, 'Helvetica Neue', Roboto, 'Liberation Sans', Arial, sans-serif" font-size="21" font-weight="700" text-anchor="start"><tspan x="116" dy="0">Probe the same token</tspan></text>
<text x="81" y="501" fill="#aab8cc" font-family="'Segoe UI', -apple-system, BlinkMacSystemFont, 'Helvetica Neue', Roboto, 'Liberation Sans', Arial, sans-serif" font-size="20" font-weight="400" text-anchor="start"><tspan x="81" dy="0">Check the exact capability.</tspan><tspan x="81" dy="27.0">Record a denial or uncertainty.</tspan></text>
<path d="M859,494 L828,494" fill="none" stroke="#75dbff" stroke-width="2" marker-end="url(#c)"/>
<path d="M455,494 L424,494" fill="none" stroke="#69dec0" stroke-width="2" marker-end="url(#m)" stroke-dasharray="7 7"/>
<rect x="66" y="581" width="258" height="32" rx="16" fill="#0d1624" stroke="#69dec0" />
<text x="195.0" y="603" fill="#69dec0" font-family="Consolas, 'Cascadia Mono', SFMono-Regular, Menlo, 'Liberation Mono', monospace" font-size="14" font-weight="650" text-anchor="middle"><tspan x="195.0" dy="0">INDEPENDENT HARNESS</tspan></text>
<rect x="740" y="581" width="294" height="32" rx="16" fill="#0d1624" stroke="#75dbff" />
<text x="887.0" y="603" fill="#75dbff" font-family="Consolas, 'Cascadia Mono', SFMono-Regular, Menlo, 'Liberation Mono', monospace" font-size="14" font-weight="650" text-anchor="middle"><tspan x="887.0" dy="0">SENTINEL + LOGIC APPS</tspan></text>
<rect x="56" y="646" width="1170" height="85" rx="14" fill="#18202b" stroke="#745e39" />
<g transform="translate(78 666) scale(1)" stroke="#ffbc4b" stroke-width="2.2" fill="none" stroke-linecap="round" stroke-linejoin="round">
<path d="M18 1L33 7v12c0 8-7 13-15 17C10 32 3 27 3 19V7Z"/><path d="M12 18l4 4 9-10"/>
</g>
<text x="132" y="679" fill="#ffbc4b" font-family="'Segoe UI', -apple-system, BlinkMacSystemFont, 'Helvetica Neue', Roboto, 'Liberation Sans', Arial, sans-serif" font-size="24" font-weight="700" text-anchor="start"><tspan x="132" dy="0">Disabled and dry-run by default</tspan></text>
<text x="132" y="710" fill="#aab8cc" font-family="'Segoe UI', -apple-system, BlinkMacSystemFont, 'Helvetica Neue', Roboto, 'Liberation Sans', Arial, sans-serif" font-size="20" font-weight="400" text-anchor="start"><tspan x="132" dy="0">Ambiguous evidence stops the workflow. Timeouts require verified shutdown.</tspan></text>
</svg>
