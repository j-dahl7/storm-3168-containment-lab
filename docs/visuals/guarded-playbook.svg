<radialGradient id="glow"><stop stop-color="#ffbc4b" stop-opacity=".14"/><stop offset="1" stop-color="#ffbc4b" stop-opacity="0"/></radialGradient>
<pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse"><path d="M40 0H0V40" fill="none" stroke="#7b8da8" stroke-opacity=".07"/></pattern>
<marker id="c" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#75dbff"/></marker>
<marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#ffbc4b"/></marker>
<marker id="m" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#69dec0"/></marker></defs>
<rect width="1280" height="828" fill="url(#bg)"/><rect width="1280" height="828" fill="url(#grid)"/>
