[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "storm3168-containment-lab"
version = "0.1.0"
description = "A guarded, evidence-first Azure service-principal containment lab"
requires-python = ">=3.12"
dependencies = []
license = {text = "MIT"}

[project.scripts]
stormlab = "stormlab.__main__:main"

[tool.setuptools.packages.find]
where = ["src"]
