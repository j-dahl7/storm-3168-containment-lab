name: Offline verification
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Install local package
        run: python -m pip install -e .
      - name: Unit tests
        run: |
          python -m unittest discover -s tests -v
          python -m unittest discover -s playbooks -p 'test_*.py' -v
      - name: Public asset checks
        run: |
          python scripts/validate_assets.py
          python fixtures/validate_artifacts.py
      - name: Compile Bicep templates (no Azure login or deployment)
        shell: bash
        run: |
          az bicep install
          mkdir -p artifacts
          while IFS= read -r -d '' template; do
            az bicep build --file "$template" --outfile "artifacts/$(echo "$template" | tr '/' '_').json"
          done < <(find infra playbooks -name '*.bicep' -print0)
      - name: Offline demo
        run: |
          python -m stormlab demo --output private/demo.jsonl
          python -m stormlab summarize --input private/demo.jsonl --output private/demo-summary.json
